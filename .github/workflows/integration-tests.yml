name: Integration Tests

on:
  workflow_call:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml
          architecture: x64
          check-latest: true

      - name: Install package
        run: pip install -e .
       
      - name: Run integration tests if script exists
        run: |
          if [ -f "./.github/workflows/assest/integration-tests.sh" ]; then
            echo "Integration test script found. Running tests..."
            bash ./.github/workflows/assest/integration-tests.sh -y
          else
            echo "Integration test script not found. Skipping..."
            exit 0
          fi
