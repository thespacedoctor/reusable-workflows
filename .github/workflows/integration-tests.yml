name: Integration Tests

on:
  workflow_call:

jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install package
        run: pip install .[test]
       
      - name: Run integration tests if script exists
        run: |
          if [ -f "./.githib/workflows/assest/integration-tests.sh" ]; then
            echo "Integration test script found. Running tests..."
            bash ./.githib/workflows/assest/integration-tests.sh -y
          else
            echo "Integration test script not found. Skipping..."
            exit 0
          fi
